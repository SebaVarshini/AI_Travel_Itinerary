
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Travel Itinerary Generator</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #070b14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: #1264ff;
            filter: blur(180px);
            opacity: 0.16;
            top: -150px;
            left: -100px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: #0044ff;
            filter: blur(180px);
            opacity: 0.12;
            bottom: -150px;
            right: -100px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: #101827;
            padding: 42px;
            border: 1px solid #263753;
            border-radius: 22px;
            box-shadow: 0 20px 70px rgba(0,0,0,0.5);
            position: relative;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #287bff, #0052cc);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            box-shadow: 0 5px 25px rgba(40,123,255,0.3);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.8px;
        }

        h1 span {
            color: #438bff;
        }

        .subtitle {
            text-align: center;
            color: #91a0b8;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .tag {
            display: table;
            margin: 0 auto 17px;
            color: #65a2ff;
            background: rgba(40,123,255,0.12);
            border: 1px solid rgba(40,123,255,0.25);
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 21px;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 600;
            color: #dce6f5;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            background: #0a1220;
            border: 1px solid #293a55;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        input::placeholder {
            color: #61718b;
        }

        input:focus {
            border-color: #438bff;
            box-shadow: 0 0 0 3px rgba(40,123,255,0.12);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #1765e8, #398bff);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(40,123,255,0.22);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(40,123,255,0.4);
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            margin-top: 24px;
        }

        @media(max-width: 550px) {
            .container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">✈️</div>

    <div class="tag">SMART TRAVEL PLANNER</div>

    <h1>AI Travel <span>Itinerary</span></h1>

    <p class="subtitle">
        Discover amazing destinations and create your
        perfect travel plan with intelligent recommendations.
    </p>

    <form action="/generate" method="POST">

        <label>📍 Destination State</label>

        <input
            type="text"
            name="state"
            required
        >

        <label>💰 Total Budget (INR)</label>

        <input
            type="number"
            name="budget"
            min="0"
            required
        >

        <label>⏱️ Available Hours Per Day</label>

        <input
            type="number"
            name="hours"
            min="1"
            step="0.5"
            required
        >

        <label>📅 Number of Days</label>

        <input
            type="number"
            name="days"
            min="1"
            max="10"
            required
        >

        <button type="submit">
            Generate My Itinerary →
        </button>

    </form>

    <div class="footer">
        POWERED BY AI • EXPLORE SMARTER, TRAVEL BETTER
    </div>

</div>

</body>
</html>
